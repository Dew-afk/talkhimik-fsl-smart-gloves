name: talkhimik_app
description: "Talkhimik companion app - FSL smart glove (Team Sagbotics, CIT-U)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 2.3.12
  flutter_riverpod: 3.4.3
  flutter_tts: 4.2.5
  hive_ce: 2.19.3
  meta: ^1.19.0
  path_provider: 2.1.5
  # Pinned 12.x: 13.x pulls permission_handler_android 14.x whose
  # compileSdk 37 exceeds AGP 9.1's supported max (36) on Flutter 3.47.
  permission_handler: 12.0.3
  share_plus: ^13.3.1
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    # Trained model (labels.json + weights.json, optional *_two.json).
    # The app works with no model present —
    # it falls back to the C1 threshold rules.
    - assets/models/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
